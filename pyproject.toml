[project]
name = "blockchains-monitor"
version = "0.2.0"
description = "High-performance blockchain protocol upgrade monitoring system with real-time risk assessment"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
keywords = ["blockchain", "monitoring", "defi", "risk-assessment", "governance"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests that require external services",
]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501", "W291", "W293", "E722"]

[tool.ruff.lint.isort]
known-first-party = ["src", "config"]

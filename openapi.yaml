openapi: 3.0.3
info:
  title: Blockchain Upgrade Monitor API
  description: >
    REST API for the Blockchain Protocol Upgrade Monitor.
    Provides risk assessment, scenario simulation, health checks,
    and real-time event data for blockchain protocol upgrades.
  version: 0.4.0
  license:
    name: MIT

servers:
  - url: http://localhost:8001
    description: Local health/API server
  - url: http://localhost:8000
    description: Local WebSocket server

paths:
  /health:
    get:
      summary: Service health check
      description: Returns overall health status and per-service checks (DB, Redis, APIs).
      operationId: getHealth
      responses:
        "200":
          description: Health status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /metrics:
    get:
      summary: System metrics summary
      description: Current and 1-hour average CPU, memory, and disk usage.
      operationId: getMetrics
      responses:
        "200":
          description: Metrics summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetricsSummary"

  /events:
    get:
      summary: Get recent blockchain events
      description: Returns the latest protocol upgrade and governance events.
      operationId: getEvents
      parameters:
        - name: chain
          in: query
          schema:
            type: string
            enum: [ethereum, polygon, arbitrum]
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: List of events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BlockchainEvent"

  /risk/assess:
    post:
      summary: Assess risk for a protocol
      operationId: assessRisk
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [protocol]
              properties:
                protocol:
                  type: string
                  example: ethereum
                proposal_data:
                  type: object
      responses:
        "200":
          description: Risk assessment result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RiskAssessment"
        "422":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /scenario/simulate:
    post:
      summary: Simulate an upgrade scenario
      operationId: simulateScenario
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [upgrade, chain]
              properties:
                upgrade:
                  type: string
                  example: EIP-9999
                chain:
                  type: string
                  enum: [ethereum, polygon, arbitrum]
                upgrade_type:
                  type: string
                  enum: [parameter_change, governance, implementation_upgrade, migration, fork, emergency]
                market_condition:
                  type: string
                  enum: [bullish, neutral, bearish, volatile, crisis]
      responses:
        "200":
          description: Scenario simulation result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScenarioResult"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        overall_status:
          type: string
          enum: [healthy, degraded, unhealthy]
        services:
          type: object
          additionalProperties:
            type: object
            properties:
              status:
                type: string
              response_time:
                type: number
              last_check:
                type: string
                format: date-time
        timestamp:
          type: string
          format: date-time

    MetricsSummary:
      type: object
      properties:
        current:
          type: object
          properties:
            cpu_percent:
              type: number
            memory_percent:
              type: number
            disk_percent:
              type: number
        averages_1h:
          type: object
          properties:
            cpu_percent:
              type: number
            memory_percent:
              type: number
            disk_percent:
              type: number

    BlockchainEvent:
      type: object
      required: [type, chain]
      properties:
        type:
          type: string
          enum: [upgrade, governance, parameter_change, emergency, fork, migration]
        chain:
          type: string
        upgrade:
          type: string
        timestamp:
          type: string
          format: date-time
        metadata:
          type: object

    RiskAssessment:
      type: object
      properties:
        protocol:
          type: string
        overall_risk_score:
          type: number
          minimum: 0
          maximum: 100
        risk_category:
          type: string
          enum: [Low, Medium, High, Critical]
        components:
          type: object
        recommendations:
          type: array
          items:
            type: string

    ScenarioResult:
      type: object
      properties:
        impact_score:
          type: number
          minimum: 0
          maximum: 100
        risk_category:
          type: string
          enum: [Low, Medium, High, Critical]
        factors:
          type: object
        recommendations:
          type: array
          items:
            type: string

    ErrorResponse:
      type: object
      properties:
        detail:
          type: string
